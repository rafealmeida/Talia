<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Splash Screen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
    body {
        margin: 0; padding: 0;
        background-color: #FFF0F5; /* Fundo rosa bem claro */
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        height: 100vh;
        color: #4A4A4A; /* Texto cinza escuro/chumbo */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }
    #logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #logo {
        font-size: 4rem;
        font-weight: bold;
        opacity: 0;
        color: #FFB6C1; /* Rosa bebê */
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    #subtitle {
        font-size: 1.2rem;
        margin-top: 10px;
        opacity: 0;
        letter-spacing: 2px;
    }
</style>
</head>
<body>
<div id="logo-container">
    <div id="logo"> Talia </div>
    <div id="subtitle">Inicializando o sistema...</div>
</div>
<script>
    // Sequência de animação do GSAP (duração total aproximada de 3.5 segundos)
    const tl = gsap.timeline();

    tl.fromTo("#logo",
        { y: 50, opacity: 0, scale: 0.5},
        { y: 0, opacity: 1, scale: 1, duration: 1.5, ease: "back.out(1.7)"})
    .to("#subtitle", { opacity: 1, y: -10, duration: 1}, "-=0.5")
    .to("#logo-container", { opacity: 0, scale: 1.2, duration: 1, delay: 1});
</script>
</body>
</html>
